name: Descobrir Telegram Chat ID

on:
  push:
    paths:
      - '.github/workflows/telegram-chat-id-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Ler chats recentes do bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token=os.environ.get("TELEGRAM_BOT_TOKEN","")
          if not token:
              print("TELEGRAM_BOT_TOKEN_NOT_CONFIGURED")
              sys.exit(2)
          try:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getUpdates", timeout=20) as r:
                  data=json.load(r)
          except Exception:
              print("TELEGRAM_GETUPDATES_FAILED")
              sys.exit(3)
          if not data.get("ok"):
              print("TELEGRAM_API_NOT_OK")
              sys.exit(4)
          chats={}
          for u in data.get("result",[]):
              for key in ("message","edited_message","channel_post","edited_channel_post","my_chat_member","chat_member","chat_join_request"):
                  obj=u.get(key)
                  if not isinstance(obj,dict):
                      continue
                  chat=obj.get("chat")
                  if not isinstance(chat,dict) or "id" not in chat:
                      continue
                  cid=str(chat["id"])
                  chats[cid]={
                      "type": str(chat.get("type","")),
                      "name": str(chat.get("title") or chat.get("username") or chat.get("first_name") or "")
                  }
          if not chats:
              print("NO_CHAT_UPDATES_FOUND")
              sys.exit(5)
          private=[(cid,meta) for cid,meta in chats.items() if meta.get("type")=="private"]
          for cid,meta in chats.items():
              safe_name=meta["name"].replace("\n"," ").replace("\r"," ")[:80]
              print(f"CHAT_ID={cid} TYPE={meta['type']} NAME={safe_name}")
          if len(private)!=1:
              print(f"EXPECTED_ONE_PRIVATE_CHAT_FOUND_{len(private)}")
              sys.exit(6)
          cid,_=private[0]
          body=json.dumps({"chat_id":cid,"text":"AM4: Telegram conectado com sucesso. As proximas execucoes poderao enviar o resumo automatico."}).encode()
          req=urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",data=body,headers={"Content-Type":"application/json"},method="POST")
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  sent=json.load(r)
          except Exception:
              print("TELEGRAM_TEST_SEND_FAILED")
              sys.exit(7)
          if not sent.get("ok"):
              print("TELEGRAM_TEST_SEND_NOT_OK")
              sys.exit(8)
          print("TELEGRAM_TEST_SEND_OK")
          PY

# probe rerun after user message
